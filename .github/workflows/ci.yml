name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend (lint, typecheck, build, e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fe
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: fe/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: fe/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('fe/package-lock.json') }}-${{ hashFiles('fe/src/**') }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('fe/package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('fe/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # Backend calls are route-mocked in specs; no Keitaro, no real API.
      - name: E2E tests
        run: npm run test:e2e

  frontend-docker:
    name: Frontend Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: fe
          push: false
          cache-from: type=gha,scope=fe
          cache-to: type=gha,mode=max,scope=fe

  backend:
    name: Backend (install, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: changeme
          POSTGRES_DB: etolegko_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d etolegko_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://app:changeme@localhost:5432/etolegko_test
      TEST_DATABASE_URL: postgresql+asyncpg://app:changeme@localhost:5432/etolegko_test
      JWT_SECRET: changeme-test-secret-key-32bytes!!
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: changeme
      GOOGLE_URL: https://google.com
      # Tests must never reach a real Keitaro: mocks only.
      KEITARO_URL: ""
      KEITARO_API_KEY: test-mock-unused
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - run: pip install -r requirements.txt

      - name: Alembic upgrade head
        run: python -m alembic upgrade head

      - name: Pytest
        run: python -m pytest -q

  backend-docker:
    name: Backend Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          cache-from: type=gha,scope=be
          cache-to: type=gha,mode=max,scope=be
